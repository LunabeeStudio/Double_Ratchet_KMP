[bundles]



[plugins]

detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kmp = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

[versions]

kotlin = "2.3.20"

kotlinx-coroutines = "1.10.2"

junit-jupiter = "6.0.3"

bouncycastle = "1.83"

detekt = "1.23.8"

[libraries]

kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutine-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
